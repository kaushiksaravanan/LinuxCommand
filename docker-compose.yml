version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python app.py
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"  # Adjust port if your app uses a different one
    environment:
      - VIRTUAL_ENV=/app/environ
    depends_on:
      - db  # Uncomment if you have a database service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"  # Adjust port if vite uses a different one
    depends_on:
      - backend

  # Uncomment and configure if needed
  # db:
  #   image: postgres:latest
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: user
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: database
